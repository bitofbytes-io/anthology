name: CI build → push → trigger deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-trigger:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: anthology-crystal-deploy
      cancel-in-progress: false
    environment:
      name: crystal1
    env:
      IMAGE_REG: ${{ vars.IMAGE_REG }}
      IMAGE_REPO: ${{ vars.IMAGE_REPO }}
      API_IMAGE_REPO: ${{ vars.API_IMAGE_REPO || format('{0}-api', vars.IMAGE_REPO) }}
      UI_IMAGE_REPO: ${{ vars.UI_IMAGE_REPO || format('{0}-ui', vars.IMAGE_REPO) }}
      MANAGER_HOST: ${{ vars.MANAGER_HOST }}
      MANAGER_REPO_PATH: ${{ vars.MANAGER_REPO_PATH }}
      PLATFORMS: linux/arm64/v8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive TAG
        id: meta
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.MANAGER_HOST }}

      - name: Verify registry Tailscale route
        run: |
          set -euo pipefail
          registry_endpoint="${IMAGE_REG%%/*}"
          registry_host="${registry_endpoint%%:*}"
          registry_ip="$(getent ahostsv4 "${registry_host}" | awk '{print $1; exit}')"
          if [[ -z "${registry_host}" || -z "${registry_ip}" ]]; then
            echo "Unable to resolve registry host over Tailscale" >&2
            exit 1
          fi
          if [[ ! "${registry_ip}" =~ ^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Resolved registry IP ${registry_ip} is not in the Tailscale CGNAT range" >&2
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://${registry_endpoint}/v2/")"
          if [[ "${status}" != "200" && "${status}" != "401" ]]; then
            echo "Registry returned unexpected HTTP status ${status}" >&2
            exit 1
          fi
          echo "Registry ${registry_endpoint} resolved to ${registry_ip} and returned HTTP ${status}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REG }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Debug refs
        run: |
          echo "IMAGE_REG=${IMAGE_REG}"
          echo "IMAGE_REPO=${IMAGE_REPO}"
          echo "API_IMAGE_REPO=${API_IMAGE_REPO}"
          echo "UI_IMAGE_REPO=${UI_IMAGE_REPO}"
          echo "TAG=${{ steps.meta.outputs.TAG }}"

      - name: Build and push anthology API & UI images
        id: build
        env:
          REGISTRY: ${{ env.IMAGE_REG }}
          API_IMAGE_REPO: ${{ env.API_IMAGE_REPO }}
          UI_IMAGE_REPO: ${{ env.UI_IMAGE_REPO }}
          PLATFORMS: ${{ env.PLATFORMS }}
          VERSION: ${{ steps.meta.outputs.TAG }}
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          API_METADATA_FILE: ${{ runner.temp }}/anthology-api-build-metadata.json
          UI_METADATA_FILE: ${{ runner.temp }}/anthology-ui-build-metadata.json
        run: |
          set -euo pipefail
          : "${REGISTRY:?Missing vars.IMAGE_REG repository variable}"
          : "${API_IMAGE_REPO:?Missing API image repository variable}"
          : "${UI_IMAGE_REPO:?Missing UI image repository variable}"
          make docker-buildx
          read_digest() {
            local digest
            digest="$(jq -r '."containerimage.digest" // empty' "$1")"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "buildx metadata $1 has no valid containerimage.digest: '${digest}'" >&2
              return 1
            fi
            printf '%s' "${digest}"
          }
          api_digest="$(read_digest "${API_METADATA_FILE}")"
          ui_digest="$(read_digest "${UI_METADATA_FILE}")"
          echo "Pushed ${REGISTRY}/${API_IMAGE_REPO}@${api_digest}"
          echo "Pushed ${REGISTRY}/${UI_IMAGE_REPO}@${ui_digest}"
          {
            echo "api_digest=${api_digest}"
            echo "ui_digest=${ui_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Install SSH key & known_hosts
        env:
          DEPLOY_KEY: ${{ secrets.LOCAL_REPO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LOCAL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push main to local bare repo (trigger hook)
        env:
          TAG: ${{ steps.meta.outputs.TAG }}
          API_IMAGE_DIGEST: ${{ steps.build.outputs.api_digest }}
          UI_IMAGE_DIGEST: ${{ steps.build.outputs.ui_digest }}
        run: |
          set -euo pipefail
          : "${MANAGER_HOST:?Missing vars.MANAGER_HOST repository variable}"
          : "${MANAGER_REPO_PATH:=/srv/git/anthology-ci.git}"
          : "${API_IMAGE_DIGEST:?Missing API image digest from the build step}"
          : "${UI_IMAGE_DIGEST:?Missing UI image digest from the build step}"
          echo "Triggering deploy via ${MANAGER_HOST}:${MANAGER_REPO_PATH}"
          git remote add local "ssh://git@${MANAGER_HOST}/${MANAGER_REPO_PATH}"
          git push --force \
            -o "image-digest=${IMAGE_REG}/${API_IMAGE_REPO}@${API_IMAGE_DIGEST}" \
            -o "image-digest=${IMAGE_REG}/${UI_IMAGE_REPO}@${UI_IMAGE_DIGEST}" \
            local HEAD:refs/heads/main

      # Git ignores the post-receive hook's exit status, so read the result it
      # records. A rerun of the same commit moves no ref, so the hook does not
      # run; checking the images fails a rerun whose build produced new digests
      # instead of passing on the earlier deploy.
      - name: Verify crystal1 deployed this revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_API_IMAGE: ${{ env.IMAGE_REG }}/${{ env.API_IMAGE_REPO }}@${{ steps.build.outputs.api_digest }}
          EXPECTED_UI_IMAGE: ${{ env.IMAGE_REG }}/${{ env.UI_IMAGE_REPO }}@${{ steps.build.outputs.ui_digest }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force local \
            refs/deploy/status:refs/remotes/local/deploy-status
          git show refs/remotes/local/deploy-status:status.json > "${RUNNER_TEMP}/anthology-deploy-status.json"
          jq -e --arg revision "${EXPECTED_REVISION}" \
            --arg api_image "${EXPECTED_API_IMAGE}" --arg ui_image "${EXPECTED_UI_IMAGE}" '
            . as $status |
            $status.schema == 1 and
            $status.state == "succeeded" and
            $status.revision == $revision and
            ([["proxy_anthology-api", $api_image], ["proxy_anthology-ui", $ui_image]] | all(
              .[0] as $service | .[1] as $image |
              $status.services[$service].revision == $revision and
              $status.services[$service].image == $image and
              $status.services[$service].desired > 0 and
              $status.services[$service].running == $status.services[$service].desired
            ))
          ' "${RUNNER_TEMP}/anthology-deploy-status.json"
