name: Test API and UI
on:
  pull_request:
permissions:
  contents: read
jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anthology
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: anthology_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthology -d anthology_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANTHOLOGY_TEST_DATABASE_URL: postgres://anthology:test-only@localhost:5432/anthology_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make api-test api-build
      - run: go test -race ./internal/items ./internal/shelves ./internal/exporter
      - name: Verify private files are excluded from Docker contexts
        run: python3 scripts/test-docker-context.py --verbose
      - name: Build API container
        run: docker build -f Docker/Dockerfile.api -t anthology-api:ci .
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make web-test web-build
      - name: Install nginx for UI security tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx
      - name: Validate UI security headers
        run: |
          /usr/sbin/nginx -v
          python3 scripts/test-ui-security.py --nginx /usr/sbin/nginx --web-root web/dist/web/browser --verbose
      - name: Build UI container
        run: docker build -f Docker/Dockerfile.ui -t anthology-ui:ci .
      - name: Validate nonroot UI container on port 8080
        run: python3 scripts/test-ui-container.py --image anthology-ui:ci --verbose
