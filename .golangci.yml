version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - errorlint
    # Preserve the remaining checks from the previous standard set.
    - ineffassign
    - unused
  exclusions:
    presets: []

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
